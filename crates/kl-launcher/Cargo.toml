[package]
name = "kl-launcher"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kl-launcher"
path = "src/main.rs"

[features]
viewport-handoff = []

[dependencies]
kl-store = { path = "../../tools/crates/kl-store" }
kl-core = { path = "../../tools/crates/kl-core" }
kl-render = { path = "../../tools/crates/kl-render" }
kl-kindle = { path = "../../tools/crates/kl-kindle" }
primitive-quick = { path = "../../tools/crates/primitive-quick" }
primitive-net = { path = "../../tools/crates/primitive-net" }
serde_json = "1"
libc.workspace = true
