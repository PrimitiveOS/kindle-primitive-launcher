name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Unit tests, clippy and shell suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests
        run: cargo test --locked --workspace
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Shell suites (stub Kindle commands)
        run: |
          for test in tests/*-test.sh; do sh "$test"; done

  desktop:
    name: Desktop screenshots
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Check out catalog preview data
        uses: actions/checkout@v5
        with:
          repository: PrimitiveOS/kindle-primitive-catalog
          ref: b812933a17cd4ff4abb0155bf303f7ee6fbe2cc6
          path: .catalog-preview
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Draw every screen
        run: |
          mkdir -p "$RUNNER_TEMP/documents"
          printf '#!/bin/sh\n# Name: KOReader\n' > "$RUNNER_TEMP/documents/KOReader.sh"
          printf '#!/bin/sh\n# Name: Primitive Browser\n' > "$RUNNER_TEMP/documents/Primitive Browser.sh"
          cargo run --locked --release -p kl-desktop -- --documents "$RUNNER_TEMP/documents" --out "$RUNNER_TEMP/screens" --catalog .catalog-preview
          test -s "$RUNNER_TEMP/screens/store-today.png"
          cargo run --locked --release -p kl-desktop -- --launcher-icon "$RUNNER_TEMP/screens/launcher-icon.png"
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-screens
          path: ${{ runner.temp }}/screens

  device-build:
    name: ARM device build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-musleabihf
      - uses: Swatinem/rust-cache@v2
      # zig and a prebuilt cargo-zigbuild from setup actions, not pip or a source build: a pip install of ziglang
      # can be refused on newer runner images (the first v0.2.6 release run failed in this step).
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1          # the version the device builds are made with
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.24.1
      - name: zip
        run: command -v zip >/dev/null || { sudo apt-get update && sudo apt-get install -y zip; }
      - name: Build the device binary
        run: cargo zigbuild --locked --release -p kl-launcher --target armv7-unknown-linux-musleabihf
      - name: Check it is an ARM binary
        run: file target/armv7-unknown-linux-musleabihf/release/kl-launcher | grep -q ARM
      - name: Package (dry run)
        run: sh scripts/package-release.sh
      - name: Keep the package
        uses: actions/upload-artifact@v4
        with:
          name: primitive-launcher-package
          path: dist/
