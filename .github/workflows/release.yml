name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    uses: PrimitiveOS/kindle-primitive-build/.github/workflows/package.yml@6235c4d7327fbcfce74fc68ec06ae3c4f9c4665d
    permissions:
      contents: write
    with:
      id: primitive-launcher
      dir: launcher
      binary-crate: kl-launcher
      arches: armhf
      firmware-min: "5.16.3"
      install-file: docs/INSTALL.md
      changelog-file: docs/CHANGELOG.md
      docs-licence-file: LICENSE-DOCS
      legacy-usb: true
